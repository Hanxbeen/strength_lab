<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무게무게 루틴 중심 와이어프레임</title><body><div id="mm-flow" class="viz-dotted-background">
<style>
#mm-flow{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:light-dark(#191f28,#f2f4f6);padding:12px;--mm-bg:light-dark(#f2f4f6,#171719);--mm-card:light-dark(#fff,#242426);--mm-muted:light-dark(#6b7684,#b0b8c1);--mm-line:light-dark(#e5e8eb,#39393d)}
#mm-flow *{box-sizing:border-box}#mm-flow .steps{display:flex;flex-wrap:wrap;gap:6px;max-width:420px;margin:0 auto 12px}#mm-flow button{font:inherit;color:inherit;border:0;cursor:pointer}#mm-flow .steps button{padding:10px 12px;background:var(--mm-card);border-radius:10px;font-size:13px;min-height:44px}#mm-flow .steps button[aria-pressed=true]{background:#2a2a2a;color:#fff}#mm-flow .phone{max-width:390px;margin:auto;background:var(--mm-bg);border:1px solid var(--mm-line);border-radius:28px;overflow:hidden}#mm-flow header{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:600}#mm-flow header button{background:transparent;min-height:44px;min-width:44px}#mm-flow main{padding:12px 20px 24px;min-height:490px}#mm-flow h2{font-size:26px;line-height:1.35;margin:8px 0 12px;letter-spacing:-.8px}#mm-flow h3{font-size:18px;margin:0 0 8px;line-height:1.45}#mm-flow p{font-size:15px;line-height:1.6;margin:6px 0 16px}#mm-flow .muted{color:var(--mm-muted)}#mm-flow .panel{padding:20px;border-radius:24px;background:var(--mm-card);margin:12px 0}#mm-flow .primary{background:#2a2a2a;color:#fff;border-radius:14px;min-height:50px;width:100%;padding:12px 16px;font-weight:600;margin-top:10px}#mm-flow .secondary{background:var(--mm-card);min-height:44px;border-radius:14px;padding:10px 14px}#mm-flow .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;font-size:15px}#mm-flow .row+.row{border-top:1px solid var(--mm-line)}#mm-flow .sub{font-size:13px;color:var(--mm-muted);line-height:1.5}#mm-flow .tag{display:inline-block;background:var(--mm-bg);padding:5px 9px;border-radius:8px;font-size:12px;margin:2px 3px 8px 0}#mm-flow nav{display:flex;background:var(--mm-card);border-top:1px solid var(--mm-line);padding:10px 10px 16px}#mm-flow nav button{flex:1;background:transparent;font-size:13px;min-height:44px}#mm-flow nav svg{display:block;margin:0 auto 4px;width:21px;height:21px}#mm-flow .metric{font-size:36px;font-weight:700;letter-spacing:-1px}#mm-flow input{font:inherit;font-size:24px;width:100px;padding:10px;border:1px solid var(--mm-line);border-radius:12px;background:var(--mm-bg);color:inherit;text-align:right}#mm-flow details{border-top:1px solid var(--mm-line);padding:14px 0;font-size:14px;line-height:1.6}#mm-flow summary{min-height:36px;cursor:pointer;font-weight:600}#mm-flow .notice{max-width:390px;margin:0 auto 12px;font-size:12px;line-height:1.5;color:var(--mm-muted)}#mm-flow .chips{display:flex;flex-wrap:wrap;gap:8px}#mm-flow .chips button{padding:10px 12px;background:var(--mm-bg);border-radius:12px;min-height:44px;font-size:14px}#mm-flow .chips button[aria-pressed=true]{background:#2a2a2a;color:#fff}#mm-flow .plot{display:flex;gap:14px;align-items:flex-end;height:90px;padding-top:12px}#mm-flow .bar{background:light-dark(#444,#ddd);width:32px;border-radius:5px 5px 0 0}#mm-flow .bar.light{opacity:.4}#mm-flow .plot span{font-size:12px}#mm-flow .plot div{text-align:center}#mm-flow .link{background:transparent;text-align:left;padding:10px 0;min-height:44px;font-size:14px;text-decoration:underline}
</style>
<div class="notice">검토용 와이어프레임 · 공개 가능한 루틴이 준비된 이후의 흐름<br>입력값·운동 기록은 예시이며, 현재 출시된 루틴이나 운동 처방이 아닙니다.</div>
<div class="steps" aria-label="화면 선택"></div>
<div class="phone"><header><span>무게무게</span><button aria-label="홈으로" data-go="home"><i data-lucide="house" aria-hidden="true"></i></button></header><main aria-live="polite"></main><nav><button data-go="home"><i data-lucide="house" aria-hidden="true"></i>홈</button><button data-go="library"><i data-lucide="dumbbell" aria-hidden="true"></i>루틴</button><button data-go="result"><i data-lucide="chart-no-axes-column" aria-hidden="true"></i>기록</button></nav></div>
<script>
(()=>{const root=document.getElementById('mm-flow');const main=root.querySelector('main');const steps=[['home','첫 홈'],['library','루틴'],['detail','상세·근거'],['setup','시작 준비'],['today','진행 홈'],['workout','운동'],['rest','휴식'],['result','결과']];let page='home',squat=100,bench=100,weight=65,reason='';
const action=(label,to)=>`<button class="primary" data-go="${to}">${label}</button>`;
const screens={
home:()=>`<h2>더 무겁게 들기 위한<br>나의 훈련</h2><p class="muted">근거가 있는 루틴을 고르고,<br>내 기록으로 다음 운동을 준비해요.</p><div class="panel"><h3>어떤 훈련을 시작할까요?</h3><p class="muted">운동 구성과 내게 맞는 조건을 먼저 살펴보세요.</p>${action('루틴 둘러보기','library')}</div><div class="row"><div>내 최대 중량<div class="sub">등록하면 시작 중량에 반영해요</div></div><button class="secondary" data-go="setup">등록</button></div><button class="link" data-go="detail">루틴의 근거는 어디서 볼 수 있나요?</button>`,
library:()=>`<h2>루틴 선택</h2><p class="muted">목표와 일정, 운동 구성을 확인하세요.</p><div class="panel"><span class="tag">스쿼트 · 벤치프레스</span><h3>중량 비율로 진행하는<br>8주 훈련</h3><p class="sub">주 3회 · 바벨·랙·벤치 필요<br>저항훈련 경험자를 대상으로 한 연구 기반</p><div class="row"><span>중량 결정</span><span>등록한 1RM 기준</span></div><div class="row"><span>데드리프트</span><span>포함하지 않음</span></div>${action('구성 살펴보기','detail')}</div><p class="sub">시안에서는 한 프로그램만 표시합니다.<br>실제 공개 개수는 검토를 마친 정의에 따라 정합니다.</p>`,
detail:()=>`<span class="tag">연구 조건 재현</span><h2>스쿼트·벤치<br>8주 훈련</h2><p class="muted">주차별 중량과 반복수가 정해진 구성</p><div class="panel"><h3>첫 운동은 이렇게 해요</h3><div class="row"><span>스쿼트</span><span>2세트 × 8회</span></div><div class="row"><span>벤치프레스</span><span>2세트 × 8회</span></div><p class="sub">첫날 중량 1RM의 65% · 세트 사이 5–7분<br>두 종목 사이 10분 · 연속되지 않는 주 3일</p></div><details><summary>어떤 사람을 연구했나요?</summary>19–35세 저항훈련 경험 남성. 연구에 참여한 조건과 앱의 적용 조건은 구분해야 합니다. 표본과 다르다는 사실만으로 위험하거나 효과가 없다고 단정하지 않습니다.</details><details><summary>무엇을 확인한 연구인가요?</summary>Helms 등(2018)은 1RM 비율 방식과 RPE 방식을 비교했습니다. 두 그룹 모두 향상됐으며, 그룹 간 차이는 통계적으로 유의하지 않았습니다. 개인의 성장량을 보장하지 않습니다.</details><details><summary>달라지거나 확인이 필요한 조건</summary>데드리프트는 다루지 않았습니다. 감독하의 소규모 연구이며 장기 정체·통증·수면에 대한 처방을 제공하지 않습니다. 실제 출시 전 적용 범위와 전체 규칙 검토가 필요합니다.</details>${action('내 조건으로 준비하기','setup')}`,
setup:()=>`<h2>시작 중량을<br>준비해요</h2><p class="muted">시안의 조건 확인이 끝난 상태예요.<br>실제 앱에서는 필요한 조건을 먼저 확인합니다.</p><div class="panel"><h3>등록한 최대 중량</h3><label class="row"><span>스쿼트</span><span><input id="squat-value" aria-label="스쿼트 최대 중량" type="number" min="1" max="2000" value="${squat}"> kg</span></label><label class="row"><span>벤치프레스</span><span><input id="bench-value" aria-label="벤치프레스 최대 중량" type="number" min="1" max="2000" value="${bench}"> kg</span></label><p class="sub">예시: 측정값 사용 · 측정일·장비 조건도 연결</p></div><p id="preview-load">첫 스쿼트 계산값 ${(squat*.65).toFixed(1)} kg</p><p class="sub">실제 장비로 가능한 중량을 확인해 선택합니다. 계산값과 선택값을 따로 보존해요.</p>${action('이 루틴으로 시작','today')}`,
today:()=>`<p class="sub">내 8주 훈련 · 1주차</p><h2>오늘의 운동</h2><div class="panel"><h3>스쿼트 · 벤치프레스</h3><p class="muted">첫 번째 운동 · 총 4세트</p><div class="row"><span>스쿼트</span><span>${(squat*.65).toFixed(1)} kg · 8회 × 2</span></div><div class="row"><span>벤치프레스</span><span>${(bench*.65).toFixed(1)} kg · 8회 × 2</span></div>${action('오늘 운동 시작','workout')}</div><button class="link" data-go="detail">전체 일정과 훈련 근거 보기</button><div class="row"><span>내 최대 중량</span><button class="secondary" data-go="setup">보기·수정</button></div>`,
workout:()=>`<p class="sub">스쿼트 · 1 / 2세트</p><h2>8회 들어 주세요</h2><div class="panel"><div class="metric">${weight} <span class="sub">kg</span></div><p class="sub">시작 목표 ${(squat*.65).toFixed(1)} kg · 8회</p><button class="secondary" id="change-weight">중량 바꾸기</button><div id="reason-area" hidden><p>바꾼 이유가 있나요?</p><div class="chips"><button data-reason="힘이 부족했어요">힘 부족</button><button data-reason="장비 때문에">장비</button><button data-reason="통증·불편함">통증·불편함</button></div><p class="sub" id="reason-label">선택하지 않아도 실제 기록은 남아요.</p></div></div><p class="sub" id="workout-message">완료 후 실제 횟수를 확인해 저장해요.</p>${action('수행 기록 · 휴식 시작','rest')}<button class="link" data-go="result">오늘 운동 종료</button>`,
rest:()=>`<p class="sub">스쿼트 1세트 기록됨</p><h2>잠시 쉬어 주세요</h2><div class="panel"><div class="metric">5:00</div><p class="muted">목표 휴식 5–7분</p><p class="sub">시안의 정지된 타이머입니다.<br>실제 앱은 경과시간과 종료 방식을 기록합니다.</p>${action('휴식 마치고 다음 세트','workout')}</div><div class="row"><span>방금 수행</span><span>${weight} kg · 8회</span></div><button class="link" data-go="result">오늘 운동 종료</button>`,
result:()=>`<h2>오늘의 운동 기록</h2><p class="muted">예시 · 스쿼트 2세트 수행 후 종료</p><div class="panel"><div class="row"><span>1세트</span><span>65 → 60 kg · 8 → 6회</span></div><div class="row"><span>2세트</span><span>65 → 60 kg · 8 → 8회</span></div><div class="row"><span>세트 사이 휴식</span><span>5–7분 → 4분</span></div><div class="row"><span>벤치프레스</span><span>미수행</span></div><p class="sub">스쿼트 목표 16회 중 14회 수행 · 87.5%<br>수행 비율이며 성장 효과 비율이 아닙니다.</p></div><div class="panel"><h3>다음 운동에서 참고해요</h3><p>60 kg으로 낮춰 수행했고,<br>힘이 부족했다고 기록했어요.</p><p class="sub">다음 운동 구성과 조건을 함께 보여주고 중량 선택에 참고합니다. 이 기록만으로 1RM을 낮추지 않아요.</p></div>${action('홈으로','today')}`
};function render(next){page=next;root.querySelector('.steps').innerHTML=steps.map(([id,label])=>`<button data-go="${id}" aria-pressed="${id===page}">${label}</button>`).join('');main.innerHTML=screens[page]();if(window.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(page==='setup'){const s=Number(root.querySelector('#squat-value').value),v=Number(root.querySelector('#bench-value').value);if(!(s>0&&s<=2000&&v>0&&v<=2000))return;squat=s;bench=v;weight=Number((squat*.65).toFixed(1));}render(b.dataset.go);}if(b.id==='change-weight'){weight=Math.max(0,weight-5);root.querySelector('.metric').innerHTML=weight+' <span class="sub">kg</span>';root.querySelector('#reason-area').hidden=false;}if(b.dataset.reason){reason=b.dataset.reason;b.setAttribute('aria-pressed','true');root.querySelector('#reason-label').textContent=reason+' · 자기보고';if(reason==='통증·불편함'){root.querySelector('#workout-message').textContent='진행을 멈췄어요. 기록을 남기고 종료할 수 있어요.';const a=main.querySelector('.primary');a.textContent='기록을 남기고 종료';a.dataset.go='result';}}});root.addEventListener('input',e=>{if(e.target.id==='squat-value')root.querySelector('#preview-load').textContent='첫 스쿼트 계산값 '+(Number(e.target.value)*.65).toFixed(1)+' kg';});render('home');})();
</script>
</div>
</body></html>
