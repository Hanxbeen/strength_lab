name: MugeMuge
options:
  bundleIdPrefix: app.mugemuge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MugeMuge:
    type: application
    platform: iOS
    sources:
      - path: MugeMuge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mugemuge.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: MugeMuge/MugeMuge.entitlements
