name: MugeMuge
options:
  bundleIdPrefix: app.mugemuge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
packages:
  RiveRuntime:
    path: RiveRuntimePackage
targets:
  MugeMuge:
    type: application
    platform: iOS
    sources:
      - path: MugeMuge
    dependencies:
      - package: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mugemuge.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "무게꾼"
        CODE_SIGN_ENTITLEMENTS: MugeMuge/MugeMugeDevelopment.entitlements
      configs:
        Debug:
          DEVELOPMENT_TEAM: C7C4WB633C
        Release:
          CODE_SIGN_ENTITLEMENTS: MugeMuge/MugeMuge.entitlements
