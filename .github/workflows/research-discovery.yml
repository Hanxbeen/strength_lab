name: Evidence discovery only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect bounded candidates without publication
        run: python -m scripts.coaching_corpus --output data/research/current/discovery.json --pages 1
      - name: Retain discovery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-discovery
          path: data/research/current/discovery.json
          if-no-files-found: error
          retention-days: 30
