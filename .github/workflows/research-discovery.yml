name: Research source checks and database import
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: research-database-import
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Fetch required source fixtures
        run: python -m research_engine.run --directory data/research/source-build
      - name: Required tests including source integration
        env:
          RESEARCH_ENGINE_SOURCE_DIR: data/research/source-build/sources
        run: python -m scripts.verify_tests
      - name: Discover, assess sources and persist one transaction
        env:
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
        run: python -m scripts.research_pipeline --directory data/research/current --persist --limit 20 --pool 100
      - name: Retain assessment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-assessments
          path: data/research/current/*.json
          if-no-files-found: ignore
          retention-days: 30
