name: Research source checks and database import
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: research-database-import
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Discover, assess sources and persist one transaction
        env:
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
        run: python -m scripts.research_pipeline --directory data/research/current --persist --limit 20 --pool 100
      - name: Retain assessment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-assessments
          path: data/research/current/*.json
          if-no-files-found: ignore
          retention-days: 30
