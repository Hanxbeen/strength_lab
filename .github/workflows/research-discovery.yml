name: Research discovery (review only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Discover 20 candidate papers
        run: python scripts/research_batch.py --limit 20 --output data/research/latest.json
      - name: Check open-access metadata and triage
        run: python scripts/research_triage.py
      - name: Check open-access full texts (no auto-publishing)
        run: python scripts/research_enrich.py --input data/research/latest.json --output data/research/enriched.json
      - name: Select open-XML candidates before truncating to 20
        run: python -m scripts.research_oa_discovery --limit 20 --pool 100
      - name: Batch OA metadata and strict SBD candidate screening
        run: python -m scripts.research_oa_v2 --pool 100 --limit 20
      - name: Audit Methods and Results evidence locations
        run: python -m scripts.research_evidence_gate --input data/research/oa_candidates_v2.json --output data/research/evidence_audit.json
      - name: Upload review-only metadata
        uses: actions/upload-artifact@v4
        with:
          name: research-candidates
          path: data/research/*.json
          retention-days: 30
