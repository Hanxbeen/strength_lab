name: Execution regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - name: Fetch required source fixtures without database writes
        run: python -m research_engine.run --directory data/research/source-build
      - name: Require all tests including original sources
        env:
          RESEARCH_ENGINE_SOURCE_DIR: data/research/source-build/sources
        run: python -m scripts.verify_tests
