name: Source programme compiler
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-programme-publication
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Fetch versioned sources and compile
        run: python -m research_engine.run --directory data/research/source-build
      - name: Require actual source coverage and adversarial tests
        env:
          RESEARCH_ENGINE_SOURCE_DIR: data/research/source-build/sources
        run: |
          python -c "from pathlib import Path; from research_engine.adapters import SOURCES; assert all((Path('data/research/source-build/sources')/(p+'.xml')).exists() for p in SOURCES)"
          python -m unittest tests.test_source_engine -v
      - name: Persist checked edition atomically
        env:
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
        run: python -m research_engine.run --directory data/research/source-build --offline --persist
      - uses: actions/upload-artifact@v4
        with:
          name: source-programme-definitions
          path: data/research/source-build/catalog-v2.json
          retention-days: 30
